<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320" width="100%" height="100%">
  <defs>
    <linearGradient id="quizBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#0c4a6e" />
    </linearGradient>
    <linearGradient id="scoreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
  </defs>

  <rect width="500" height="320" rx="16" fill="url(#quizBg)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" />
  
  <!-- Header -->
  <rect x="0" y="0" width="500" height="46" rx="16" fill="rgba(255, 255, 255, 0.05)" />
  <rect x="0" y="26" width="500" height="20" fill="rgba(255, 255, 255, 0.05)" />
  <circle cx="28" cy="23" r="5" fill="#ef4444" />
  <circle cx="44" cy="23" r="5" fill="#f59e0b" />
  <circle cx="60" cy="23" r="5" fill="#10b981" />
  <text x="85" y="27" fill="#f8fafc" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700">Interactive Employee Quiz &amp; Training Platform</text>
  <rect x="370" y="12" width="110" height="22" rx="11" fill="rgba(16, 185, 129, 0.2)" stroke="#10b981" stroke-width="1" />
  <text x="425" y="27" fill="#34d399" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="600" text-anchor="middle">Live Assessment</text>

  <!-- Quiz Question Container -->
  <g transform="translate(24, 60)">
    <rect x="0" y="0" width="452" height="236" rx="12" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(255, 255, 255, 0.08)" />
    
    <!-- Progress Indicator -->
    <text x="20" y="25" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="9">QUESTION 08 OF 15</text>
    <rect x="20" y="34" width="412" height="6" rx="3" fill="rgba(255, 255, 255, 0.08)" />
    <rect x="20" y="34" width="220" height="6" rx="3" fill="url(#scoreGrad)" />
    <text x="400" y="25" fill="#f59e0b" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700">⏱ 01:45</text>

    <!-- Question Title -->
    <text x="20" y="65" fill="#f8fafc" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600">Which UX principle prioritizes consistent mental models across product modules?</text>

    <!-- Option Cards -->
    <g transform="translate(20, 80)">
      <!-- Option A -->
      <rect x="0" y="0" width="412" height="34" rx="8" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.1)" />
      <circle cx="20" cy="17" r="8" fill="rgba(255, 255, 255, 0.1)" />
      <text x="20" y="20" fill="#cbd5e1" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" text-anchor="middle">A</text>
      <text x="38" y="21" fill="#cbd5e1" font-family="'Plus Jakarta Sans', sans-serif" font-size="10">Fitts's Law on target acquisition speeds</text>

      <!-- Option B (Selected / Correct) -->
      <rect x="0" y="42" width="412" height="34" rx="8" fill="rgba(16, 185, 129, 0.15)" stroke="#10b981" stroke-width="1.2" />
      <circle cx="20" cy="59" r="8" fill="#10b981" />
      <text x="20" y="62" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" text-anchor="middle">B</text>
      <text x="38" y="63" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600">Jakob's Law of Familiar User Experience Patterns</text>
      <circle cx="395" cy="59" r="6" fill="#10b981" />
      <path d="M392 59 L394 61 L398 57" stroke="#ffffff" stroke-width="1.2" fill="none" />

      <!-- Option C -->
      <rect x="0" y="84" width="412" height="34" rx="8" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.1)" />
      <circle cx="20" cy="101" r="8" fill="rgba(255, 255, 255, 0.1)" />
      <text x="20" y="104" fill="#cbd5e1" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" text-anchor="middle">C</text>
      <text x="38" y="105" fill="#cbd5e1" font-family="'Plus Jakarta Sans', sans-serif" font-size="10">Miller's 7±2 Information Chunking Principle</text>
    </g>

    <!-- Bottom Controls in Solid Blue -->
    <rect x="332" y="196" width="100" height="26" rx="6" fill="#0284c7" />
    <text x="382" y="213" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" text-anchor="middle">Next Question →</text>
  </g>
</svg>
