<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320" width="100%" height="100%">
  <defs>
    <linearGradient id="remitBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="matchGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Card Background -->
  <rect width="500" height="320" rx="16" fill="url(#remitBg)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />
  
  <!-- Header Bar -->
  <rect x="0" y="0" width="500" height="50" rx="16" fill="rgba(255, 255, 255, 0.05)" />
  <rect x="0" y="30" width="500" height="20" fill="rgba(255, 255, 255, 0.05)" />
  <circle cx="28" cy="25" r="5" fill="#ef4444" />
  <circle cx="44" cy="25" r="5" fill="#f59e0b" />
  <circle cx="60" cy="25" r="5" fill="#10b981" />
  <text x="85" y="29" fill="#f8fafc" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700">Remittance Reconciliation Platform</text>
  <rect x="360" y="14" width="120" height="22" rx="11" fill="rgba(16, 185, 129, 0.15)" stroke="#10b981" stroke-width="1" />
  <text x="420" y="29" fill="#34d399" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="600" text-anchor="middle">SAP-Ready Posting</text>

  <!-- Metric Badges Row -->
  <g transform="translate(24, 65)">
    <rect x="0" y="0" width="140" height="58" rx="10" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(255, 255, 255, 0.08)" />
    <text x="14" y="22" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="9">Total Processed</text>
    <text x="14" y="44" fill="#38bdf8" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="700">$2.4M</text>
    
    <rect x="155" y="0" width="140" height="58" rx="10" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(255, 255, 255, 0.08)" />
    <text x="169" y="22" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="9">Auto-Match Accuracy</text>
    <text x="169" y="44" fill="#34d399" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="700">98.4%</text>

    <rect x="310" y="0" width="140" height="58" rx="10" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(255, 255, 255, 0.08)" />
    <text x="324" y="22" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="9">Manual Effort Saved</text>
    <text x="324" y="44" fill="#a855f7" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="700">-65%</text>
  </g>

  <!-- Data Table UI Preview -->
  <g transform="translate(24, 138)">
    <rect x="0" y="0" width="452" height="158" rx="10" fill="rgba(15, 23, 42, 0.7)" stroke="rgba(255, 255, 255, 0.08)" />
    <!-- Table Header -->
    <rect x="0" y="0" width="452" height="32" rx="10" fill="rgba(255, 255, 255, 0.05)" />
    <rect x="0" y="16" width="452" height="16" fill="rgba(255, 255, 255, 0.05)" />
    <text x="16" y="21" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="600">INVOICE ID</text>
    <text x="110" y="21" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="600">ACCOUNT / ENTITY</text>
    <text x="235" y="21" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="600">AMOUNT</text>
    <text x="330" y="21" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="600">MATCH STATUS</text>

    <!-- Row 1 -->
    <line x1="0" y1="33" x2="452" y2="33" stroke="rgba(255, 255, 255, 0.06)" />
    <text x="16" y="54" fill="#e2e8f0" font-family="'Plus Jakarta Sans', sans-serif" font-size="10">#INV-8924</text>
    <text x="110" y="54" fill="#cbd5e1" font-family="'Plus Jakarta Sans', sans-serif" font-size="10">Global Logistics Corp</text>
    <text x="235" y="54" fill="#f8fafc" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600">$48,250.00</text>
    <rect x="330" y="42" width="76" height="18" rx="9" fill="rgba(16, 185, 129, 0.2)" stroke="#10b981" stroke-width="0.8" />
    <text x="368" y="54" fill="#34d399" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="600" text-anchor="middle">Automated ✓</text>

    <!-- Row 2 -->
    <line x1="0" y1="72" x2="452" y2="72" stroke="rgba(255, 255, 255, 0.06)" />
    <text x="16" y="93" fill="#e2e8f0" font-family="'Plus Jakarta Sans', sans-serif" font-size="10">#INV-8925</text>
    <text x="110" y="93" fill="#cbd5e1" font-family="'Plus Jakarta Sans', sans-serif" font-size="10">Apex Cloud Tech Inc</text>
    <text x="235" y="93" fill="#f8fafc" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600">$12,800.00</text>
    <rect x="330" y="81" width="76" height="18" rx="9" fill="rgba(16, 185, 129, 0.2)" stroke="#10b981" stroke-width="0.8" />
    <text x="368" y="93" fill="#34d399" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="600" text-anchor="middle">Automated ✓</text>

    <!-- Row 3 -->
    <line x1="0" y1="111" x2="452" y2="111" stroke="rgba(255, 255, 255, 0.06)" />
    <text x="16" y="132" fill="#e2e8f0" font-family="'Plus Jakarta Sans', sans-serif" font-size="10">#INV-8926</text>
    <text x="110" y="132" fill="#cbd5e1" font-family="'Plus Jakarta Sans', sans-serif" font-size="10">Quantum Media LLC</text>
    <text x="235" y="132" fill="#f8fafc" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600">$94,110.00</text>
    <rect x="330" y="120" width="76" height="18" rx="9" fill="rgba(245, 158, 11, 0.2)" stroke="#f59e0b" stroke-width="0.8" />
    <text x="368" y="132" fill="#fbbf24" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="600" text-anchor="middle">Review Needed</text>
  </g>
</svg>
