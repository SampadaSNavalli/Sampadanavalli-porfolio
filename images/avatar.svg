<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="avatarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.9" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Glow & Circle -->
  <circle cx="100" cy="100" r="88" fill="url(#avatarGrad)" opacity="0.2" filter="url(#glow)" />
  <circle cx="100" cy="100" r="82" fill="#0f172a" stroke="url(#ringGrad)" stroke-width="3" stroke-dasharray="8 4" />
  <circle cx="100" cy="100" r="72" fill="url(#avatarGrad)" />
  
  <!-- Silhouette / Designer Elements -->
  <path d="M100 52 A22 22 0 0 1 100 96 A22 22 0 0 1 100 52 Z" fill="#ffffff" opacity="0.95"/>
  <path d="M60 142 C60 116 80 108 100 108 C120 108 140 116 140 142 C128 152 114 156 100 156 C86 156 72 152 60 142 Z" fill="#ffffff" opacity="0.95"/>
  
  <!-- Floating UI Badge -->
  <rect x="110" y="118" width="76" height="24" rx="12" fill="#0c4a6e" stroke="#38bdf8" stroke-width="1.5" />
  <text x="148" y="134" fill="#38bdf8" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" text-anchor="middle">PRODUCT UX</text>
  
  <!-- Floating Sparkle -->
  <circle cx="48" cy="64" r="4" fill="#38bdf8" filter="url(#glow)" />
  <circle cx="156" cy="56" r="3" fill="#06b6d4" />
</svg>
