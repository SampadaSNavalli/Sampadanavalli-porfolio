<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" width="100%" height="100%">
  <defs>
    <!-- Solid & Clean Gradients (No Purple, No Pink) -->
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0ea5e9" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
    </filter>
  </defs>

  <!-- Ambient blue/cyan glows (No purple/pink) -->
  <circle cx="160" cy="140" r="120" fill="#0284c7" opacity="0.22" filter="url(#softGlow)" />
  <circle cx="460" cy="260" r="130" fill="#06b6d4" opacity="0.2" filter="url(#softGlow)" />

  <!-- Main Glass Window Frame -->
  <rect x="40" y="30" width="520" height="355" rx="18" fill="url(#cardGrad)" stroke="rgba(255, 255, 255, 0.16)" stroke-width="1.5" filter="url(#cardShadow)" />
  
  <!-- Header Bar -->
  <rect x="40" y="30" width="520" height="42" rx="18" fill="rgba(255, 255, 255, 0.04)" />
  <rect x="40" y="52" width="520" height="20" fill="rgba(255, 255, 255, 0.04)" />
  <line x1="40" y1="72" x2="560" y2="72" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
  
  <!-- Mac Window Dots -->
  <circle cx="65" cy="51" r="5" fill="#ef4444" opacity="0.9" />
  <circle cx="82" cy="51" r="5" fill="#f59e0b" opacity="0.9" />
  <circle cx="99" cy="51" r="5" fill="#10b981" opacity="0.9" />
  
  <rect x="195" y="43" width="210" height="18" rx="9" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="0.8" />
  <text x="300" y="55" fill="#94a3b8" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="9" text-anchor="middle" font-weight="600">enterprise-design-system.figma</text>

  <!-- Left Sidebar (Toolbox / Layers) -->
  <rect x="58" y="88" width="105" height="278" rx="10" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(255, 255, 255, 0.06)" stroke-width="1" />
  <rect x="70" y="102" width="80" height="9" rx="4" fill="#0284c7" opacity="0.9" />
  <rect x="70" y="120" width="60" height="6" rx="3" fill="rgba(255, 255, 255, 0.25)" />
  <rect x="70" y="136" width="70" height="6" rx="3" fill="rgba(255, 255, 255, 0.25)" />
  <rect x="70" y="152" width="50" height="6" rx="3" fill="rgba(255, 255, 255, 0.25)" />
  
  <rect x="70" y="180" width="80" height="9" rx="4" fill="#06b6d4" opacity="0.9" />
  <rect x="70" y="198" width="65" height="6" rx="3" fill="rgba(255, 255, 255, 0.25)" />
  <rect x="70" y="214" width="55" height="6" rx="3" fill="rgba(255, 255, 255, 0.25)" />
  <rect x="70" y="230" width="75" height="6" rx="3" fill="rgba(255, 255, 255, 0.25)" />

  <!-- Center Card 1: Enterprise Dashboard Node -->
  <g transform="translate(180, 88)">
    <rect x="0" y="0" width="230" height="135" rx="12" fill="rgba(15, 23, 42, 0.9)" stroke="rgba(2, 132, 199, 0.4)" stroke-width="1.2" filter="url(#cardShadow)" />
    <text x="16" y="24" fill="#f8fafc" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700">Enterprise SLA Monitor</text>
    <text x="16" y="38" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="9">Reconciliation &amp; Workflows</text>
    
    <!-- Mini Bar Chart in Cyan & Blue -->
    <rect x="20" y="90" width="16" height="26" rx="3" fill="#0284c7" opacity="0.6" />
    <rect x="44" y="74" width="16" height="42" rx="3" fill="#0284c7" opacity="0.85" />
    <rect x="68" y="58" width="16" height="58" rx="3" fill="#0ea5e9" />
    <rect x="92" y="80" width="16" height="36" rx="3" fill="#38bdf8" opacity="0.8" />
    <rect x="116" y="48" width="16" height="68" rx="3" fill="#0284c7" />
    <rect x="140" y="66" width="16" height="50" rx="3" fill="#06b6d4" opacity="0.8" />
    <rect x="164" y="42" width="16" height="74" rx="3" fill="#10b981" />
    <rect x="188" y="60" width="16" height="56" rx="3" fill="#38bdf8" opacity="0.8" />
  </g>

  <!-- Center Card 2: Interactive Component System (Solid Buttons, No Pink/Purple) -->
  <g transform="translate(180, 238)">
    <rect x="0" y="0" width="360" height="128" rx="12" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.2" />
    <text x="16" y="24" fill="#f8fafc" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600">Component System // Buttons &amp; Tokens</text>
    
    <!-- Solid Button 1 (Blue) -->
    <rect x="16" y="38" width="86" height="28" rx="14" fill="#0284c7" />
    <text x="59" y="55" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" text-anchor="middle">Publish Flow</text>

    <!-- Solid Button 2 (Dark Glass) -->
    <rect x="112" y="38" width="82" height="28" rx="14" fill="rgba(255, 255, 255, 0.08)" stroke="rgba(255, 255, 255, 0.25)" stroke-width="1" />
    <text x="153" y="55" fill="#e2e8f0" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="600" text-anchor="middle">Draft Mode</text>

    <!-- Solid Button 3 (Emerald) -->
    <rect x="204" y="38" width="82" height="28" rx="14" fill="#059669" />
    <text x="245" y="55" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="600" text-anchor="middle">SAP Sync ✓</text>

    <!-- Color Swatches (Clean Blue / Teal / Emerald / Amber) -->
    <circle cx="28" cy="95" r="9" fill="#0284c7" stroke="#ffffff" stroke-width="1.5" />
    <circle cx="52" cy="95" r="9" fill="#0ea5e9" stroke="#ffffff" stroke-width="1.5" />
    <circle cx="76" cy="95" r="9" fill="#06b6d4" stroke="#ffffff" stroke-width="1.5" />
    <circle cx="100" cy="95" r="9" fill="#10b981" stroke="#ffffff" stroke-width="1.5" />
    <circle cx="124" cy="95" r="9" fill="#f59e0b" stroke="#ffffff" stroke-width="1.5" />
    <text x="148" y="99" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="600">Design Tokens Active</text>
  </g>

  <!-- Right Property Panel -->
  <g transform="translate(425, 88)">
    <rect x="0" y="0" width="115" height="135" rx="10" fill="rgba(30, 41, 59, 0.9)" stroke="rgba(6, 182, 212, 0.4)" stroke-width="1" filter="url(#cardShadow)" />
    <text x="12" y="24" fill="#38bdf8" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700">AUTO LAYOUT</text>
    <rect x="12" y="38" width="90" height="17" rx="4" fill="rgba(255, 255, 255, 0.08)" />
    <text x="18" y="50" fill="#e2e8f0" font-family="'Plus Jakarta Sans', sans-serif" font-size="8">Direction: Row ↔</text>
    <rect x="12" y="62" width="90" height="17" rx="4" fill="rgba(255, 255, 255, 0.08)" />
    <text x="18" y="74" fill="#e2e8f0" font-family="'Plus Jakarta Sans', sans-serif" font-size="8">Padding: 24px</text>
    <rect x="12" y="86" width="90" height="17" rx="4" fill="rgba(255, 255, 255, 0.08)" />
    <text x="18" y="98" fill="#e2e8f0" font-family="'Plus Jakarta Sans', sans-serif" font-size="8">Gap: 16px</text>
    <rect x="12" y="110" width="90" height="16" rx="4" fill="rgba(16, 185, 129, 0.2)" stroke="#10b981" stroke-width="0.8" />
    <text x="57" y="122" fill="#34d399" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="600" text-anchor="middle">Responsive ✓</text>
  </g>

  <!-- Collaborative Figma Cursor in Solid Cyan / Blue -->
  <g transform="translate(325, 185)">
    <path d="M0 0 L0 18 L4.5 13.5 L9.5 22 L12.5 20.5 L7.5 12 L14 12 Z" fill="#0284c7" stroke="#ffffff" stroke-width="1.2" />
    <g transform="translate(14, 14)">
      <rect x="0" y="0" width="135" height="22" rx="11" fill="#0284c7" />
      <text x="67" y="15" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" text-anchor="middle">Sampada (Product Designer)</text>
    </g>
  </g>
  
  <!-- Floating Badge Left Bottom -->
  <g transform="translate(18, 305)">
    <rect x="0" y="0" width="136" height="48" rx="12" fill="rgba(15, 23, 42, 0.95)" stroke="rgba(2, 132, 199, 0.4)" stroke-width="1.2" filter="url(#cardShadow)" />
    <circle cx="24" cy="24" r="12" fill="#0284c7" />
    <path d="M19 24 L22 27 L28 20" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    <text x="44" y="20" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700">4+ Years</text>
    <text x="44" y="34" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="9">UI/UX Expertise</text>
  </g>
</svg>
